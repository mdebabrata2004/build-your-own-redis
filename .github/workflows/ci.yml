name: Production CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test-and-build:
    name: Java 21 Backend Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit & Integration Tests (JUnit 5)
        run: mvn clean test --batch-mode

      - name: Package Shaded Uber-JAR
        run: mvn package -DskipTests --batch-mode

      - name: Verify Output JAR Exists
        run: |
          test -f target/mini-redis-1.0-SNAPSHOT-all.jar
          ls -lh target/*.jar

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: localdata-standalone-jar
          path: target/mini-redis-1.0-SNAPSHOT-all.jar
          retention-days: 7

  sdk-test-and-build:
    name: TypeScript SDK Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package.json

      - name: Install SDK Dependencies
        working-directory: sdk/typescript
        run: npm ci || npm install

      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: npm run build

      - name: Verify SDK Distribution Files
        working-directory: sdk/typescript
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts

  docker-build-check:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    needs: [backend-test-and-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: localdata-managed-redis:ci
